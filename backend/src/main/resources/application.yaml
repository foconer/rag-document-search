spring:
  application:
    name: rag-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://postgres:5432/ragdb
    username: raguser
    password: ragpassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

ollama:
  url: http://ollama:11434
  model: nomic-embed-text